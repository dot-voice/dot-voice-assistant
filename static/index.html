<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dot">
<title>Dot</title>
<style>
  :root { --bg:#0b0b0f; --card:#1a1c21; --text:#f2f3f5; --muted:#8b909a; --green:#34c759; --blue:#0a84ff; --amber:#ff9f0a; --red:#ff453a; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; height:100dvh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; }
  /* bottom: half the home-indicator inset is enough; the full inset plus stage padding left a big empty band */
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) 12px max(2px, calc(env(safe-area-inset-bottom) - 30px)); }
  header { padding:10px 2px 2px; display:flex; align-items:baseline; justify-content:space-between; }
  header h1 { font-family:ui-serif,"New York",Georgia,serif; font-size:22px; font-weight:600; letter-spacing:.01em; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:8px 0 12px; }
  .msg { max-width:88%; font-size:17px; line-height:1.4; }
  .msg.user { align-self:flex-end; padding:8px 13px; border-radius:18px; background:#1d2027; color:#c9ccd3; font-size:16px; }
  .msg.assistant { align-self:flex-start; font-family:ui-serif,"New York",Georgia,serif; font-size:19px; color:var(--text); padding:2px 2px; }
  #log { -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 22px); mask-image:linear-gradient(to bottom, transparent 0, #000 22px); }
  .chip { align-self:center; font-size:13px; padding:6px 12px; border-radius:14px; background:#2a2418; color:var(--amber); }
  .chip.err { background:#2b1a19; color:var(--red); }
  button.chip { width:auto; max-width:none; border:0; font-size:14px; font-weight:600; padding:9px 16px; }
  /* Dot */
  /* in a call the header hides: Dot's name and status sit beside the face */
  #top { display:flex; align-items:center; gap:14px; padding:12px 4px 6px; }
  #who { display:flex; flex-direction:column; gap:2px; min-width:0; }
  #name { font-family:ui-serif,"New York",Georgia,serif; font-size:24px; font-weight:600; }
  #state { font-size:15px; color:var(--muted); }
  body.incall header { display:none; }
  /* session menu */
  #toBtn { margin-left:auto; width:auto; max-width:46%; padding:9px 14px; border-radius:999px; background:#1d2027; color:#e6e7ea;
           font-size:15px; font-weight:600; border:1px solid #2e323b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #toMenu { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.55); display:flex; align-items:flex-start; justify-content:flex-end;
            padding:calc(env(safe-area-inset-top) + 64px) 12px 12px; }
  #toList { background:#16181d; border:1px solid #2e323b; border-radius:18px; padding:6px; width:min(260px, 100%);
            max-height:calc(100dvh - 120px); overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  #toList button { width:100%; max-width:none; text-align:left; background:transparent; color:#e6e7ea; font-size:16px; font-weight:500;
                   padding:12px 14px; border-radius:12px; }
  #toList button.sel { background:#2a2d34; font-weight:700; }
  #toList hr { border:0; border-top:1px solid #2a2d34; margin:4px 8px; }
  .face { position:relative; width:92px; height:92px; border-radius:50%; flex:none; transition:transform .09s linear; }
  .face img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; position:relative; z-index:1;
              border:2px solid var(--bg); transition:filter .4s; }
  .face::before { content:""; position:absolute; inset:-3px; border-radius:50%; z-index:0; opacity:.35;
                  background:conic-gradient(from 0deg, #ffb38a, #ff6f61, #c04dff, #6ea8ff, #ffb38a); transition:opacity .4s; }
  .face img.gone { display:none; }
  .face.noimg { background:var(--bg); }
  .face.noimg::before { opacity:.7; }
  .face.big { width:104px; height:104px; animation:breathe 4.2s ease-in-out infinite; }
  .face.big::before { opacity:.8; }
  #orb.listening { animation:breathe 4.2s ease-in-out infinite; }
  #orb.listening::before { opacity:.9; }
  #orb.thinking::before, #orb.working::before { opacity:1; animation:spin 1.4s linear infinite; }
  #orb.thinking img, #orb.working img { animation:tilt 2.4s ease-in-out infinite; }
  #orb.speaking::before { opacity:1; animation:spin 6s linear infinite; }
  #orb.speaking { animation:speak 3.2s ease-in-out infinite; }   /* a calm breath while Dot talks, not a shake */
  #orb:not(.listening):not(.thinking):not(.working):not(.speaking) img { filter:grayscale(.7) brightness(.7); }
  @keyframes breathe { 0%,100% { scale:1; } 50% { scale:1.04; } }
  @keyframes speak { 0%,100% { scale:1; } 50% { scale:1.035; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes glow { 0%,100% { filter:blur(0); } 50% { filter:blur(4px); } }
  @keyframes tilt { 0%,100% { transform:rotate(0); } 30% { transform:rotate(-4deg); } 70% { transform:rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { .face, .face::before, .face img { animation:none !important; } }
  button { font-size:18px; font-weight:600; border:0; border-radius:28px; padding:16px 34px; color:#fff; background:var(--green); width:100%; max-width:340px; }
  button.end { background:var(--red); }
  button.ghost { background:#2a2d34; font-size:15px; padding:10px 20px; width:auto; }
  input { font-size:26px; letter-spacing:.35em; text-align:center; width:100%; max-width:340px; padding:14px; border-radius:16px; border:1px solid #333; background:var(--card); color:var(--text); }
  #login { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:16px; text-align:center; padding-top:8px; }
  #login p { color:var(--muted); font-size:15px; max-width:320px; line-height:1.4; }
  #call { flex:1; display:flex; flex-direction:column; min-height:0; }
  .hidden { display:none !important; }

  #stage { display:flex; flex-direction:column; align-items:center; padding:2px 0 0; width:100%; }
  .msg.live { opacity:.6; font-style:italic; }
  /* one row of six */
  #controls { display:flex; gap:6px; width:100%; max-width:480px; }
  .ctl { flex:1 1 0; min-width:0; width:auto; max-width:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
         min-height:62px; padding:8px 2px; border-radius:16px; background:#2a2d34; color:#f2f3f5; font-size:13px; font-weight:600; line-height:1.1; }
  .ctl .ico { font-size:20px; line-height:1; }
  .ctl .lbl { font-size:11.5px; font-weight:600; opacity:.9; white-space:nowrap; }
  .ctl:active { transform:scale(.97); }
  .ctl.on { background:#ff9f0a; color:#1a1200; }
  .ctl.danger { background:#ff453a; color:#fff; }
  #dbg { display:none; }
  body.debug #dbg { display:block; }
  #row { display:flex; gap:12px; }
</style>
</head>
<body>
<header><h1>Dot</h1><span id="ver" hidden>@@VERSION@@ &middot; @@BUILT@@</span></header>

<!-- A real form with username + current-password lets iOS save the PIN in iCloud Keychain and fill it with Face ID.
    The server still checks the PIN; nothing about auth changed. -->
<form id="login" action="#" method="post" autocomplete="on">
  <div class="face big" id="loginFace"><img src="/dot/dot-portrait.jpg" alt="Dot" onerror="this.classList.add('gone');if(this.parentNode)this.parentNode.classList.add('noimg');"></div>
  <p>Hi @@OWNER@@, it's @@ASSISTANT@@. Enter your PIN to talk.</p>
  <input id="user" name="username" type="text" autocomplete="username" value="@@USER@@" readonly style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" aria-hidden="true">
  <input id="pin" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
  <button id="start" type="submit">Talk to Dot</button>
  <p id="loginMsg"></p>
</form>

<section id="call" class="hidden">
  <div id="top"><div class="face" id="orb" title="Tap to change Dot's look"><img id="dotImg" src="/dot/dot-portrait.jpg" alt="Dot" onerror="this.classList.add('gone');if(this.parentNode)this.parentNode.classList.add('noimg');"></div>
    <div id="who"><div id="name">Dot</div><div id="state"></div></div>
    <button id="toBtn" type="button" aria-label="Choose who you talk to">&#9776; <span id="toLbl">Auto</span></button></div>
  <div id="toMenu" class="hidden"><div id="toList"></div></div>
  <div id="log"></div>
  <div id="dbg" style="font:11px monospace;opacity:.6;padding:4px 12px"></div>
  <div id="stage">
    <div id="controls">
      <button class="ctl" id="mute"><span class="ico">&#127908;</span><span class="lbl">Mute</span></button>
      <button class="ctl" id="stopTalk"><span class="ico">&#9197;</span><span class="lbl">Skip</span></button>
      <button class="ctl" id="liveBtn"><span class="ico">&#9889;</span><span class="lbl">Live</span></button>
      <button class="ctl" id="langBtn"><span class="ico">&#127760;</span><span class="lbl">EN</span></button>
      <button class="ctl danger" id="end"><span class="ico">&#9742;</span><span class="lbl">End</span></button>
    </div>
  </div>
</section>

<script>
"use strict";
// ---------------------------------------------------------------- settings
const TARGET_RATE = 16000;
const HANGOVER_MS = 700;          // silence that ends an utterance
const MIN_SPEECH_MS = 350;        // shorter than this is a click, not speech
const MAX_UTTERANCE_S = 30;
const PREROLL_MS = 300;
const BARGE_IN_MS = 400;          // sustained speech needed to interrupt the assistant
const MIN_THRESHOLD = 0.015;
const LABELS = { listening:"Listening", thinking:"Thinking",
                 speaking:"Speaking", working:"Handing over",
                 connecting:"Connecting", muted:"Muted" };

// ---------------------------------------------------------------- state
const APP_VER = "@@VERSION@@";
let currentVersion = APP_VER;
let lastSent = "";
const clientEvents = [];
function logEvent(type) {
  clientEvents.push({ t: Date.now(), type: type });
  if (clientEvents.length > 30) clientEvents.shift();
}
let chatLines = [];
function getChatLines() {
  if (chatLines.length) return chatLines.slice(-12);
  const msgs = $("log") ? $("log").querySelectorAll(".msg:not(.live)") : [];
  const out = [];
  for (let i = 0; i < msgs.length; i++) {
    const el = msgs[i];
    const who = el.classList.contains("user") ? "user" : (el.classList.contains("assistant") ? "assistant" : "unknown");
    out.push({ who: who, text: (el.textContent || "").trim() });
  }
  return out.slice(-12);
}
let ws = null, pin = "", ctx = null, stream = null, node = null, wakeLock = null;
let inCall = false, muted = false, serverState = "connecting";
let playing = false, dropAudio = false, ackPending = 0, genId = 0;
let sources = [], nextTime = 0, decodeChain = Promise.resolve();
let reconnectTries = 0, starting = false;
let keptStream = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let earsPhone = !!SR, recog = null, recogWant = false, recogLang = "en-US", lastPlayAt = 0;
let sentN = 0, lastMsg = '', dbgAt = 0, lastLevel = 0, lastThr = 0;
let phoneVoice = false, speakCount = 0;   // default: Qwen voice from the Mac
let speechEndAt = 0, metricSent = true;
const SEND_PAUSE_MS = 1100;   // 800 cut the caller off mid-thought   // phone ears: quiet time after the last words before the sentence is sent
let heard = "", heardTimer = null, interim = "";
// VAD
let noiseFloor = 0.01, quietMs = 0, inSpeech = false, speechMs = 0, silenceMs = 0, loudMs = 0;
let utter = [], preroll = [], prerollSamples = 0, utterSamples = 0;

// Live mode
let liveMode = false;
let liveSources = [], liveNextTime = 0;
let liveAcc = [], liveAccLen = 0;
const LIVE_CHUNK_SAMPLES = 960;   // ~60 ms at 16 kHz
let workletBlobUrl = null;
let liveOk = false;
let liveDropAudio = false, liveSilenceTimer = null;
let micSrc = null, keepAliveSrc = null;
let tapToListen = false, modeRunningBeforeLive = null;

const $ = id => document.getElementById(id);
function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
try {
  if (load("liveDefault") !== "1") { store("live", "true"); store("liveDefault", "1"); }   // v40: Live is the main mode
  liveMode = load("live") !== "false";
} catch (e) { liveMode = true; }

function setState(s) {
  logEvent("state:" + s);
  serverState = s;
  render();
}
let busySince = 0, busyTimer = null;
function render() {
  let s = playing ? "speaking" : serverState;
  if (muted && s === "listening") s = "muted";
  const busy = (s === "thinking" || s === "working");
  if (earsPhone && recogWant) {
    // Ears stay off for the whole reply, not just while a sound part plays: Qwen leaves 1-2 s gaps between sentences, the
    // ears switched on in each gap, heard the assistant itself and iOS's audio-mode switch made the voice choppy
    //.
    if (playing || serverState === "speaking" || serverState === "working") { lastPlayAt = Date.now(); stopRecog(); showLive(""); }
    else if (!recog && inCall) { if (Date.now() - lastPlayAt > 500) startRecog(); else setTimeout(render, 520); }
  }
  if (busy && !busySince) { busySince = Date.now(); busyTimer = setInterval(render, 250); }
  if (!busy && busySince) { busySince = 0; clearInterval(busyTimer); busyTimer = null; }
  const secs = busy ? " " + ((Date.now() - busySince) / 1000).toFixed(1) + "s" : "";
  $("state").textContent = (LABELS[s] || "") + secs;
  $("orb").className = "face " + ((s === "muted") ? "" : s);
}
function addMsg(role, text) {
  chatLines.push({ who: role, text: String(text || "") });
  if (chatLines.length > 30) chatLines.shift();
  const d = document.createElement("div");
  d.className = "msg " + role; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}
function addChip(text, err, onClick) {
  const d = document.createElement("div");
  d.className = "chip" + (err ? " err" : ""); d.textContent = text;
  if (onClick) {
    d.style.cursor = "pointer";
    d.onclick = onClick;
  }
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}

// ---------------------------------------------------------------- websocket
function wsUrl() { return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"; }

function connect() {
  return new Promise((resolve, reject) => {
    setState("connecting");
    ws = new WebSocket(wsUrl());
    ws.binaryType = "arraybuffer";
    let settled = false;
    ws.onopen = () => {
      logEvent("ws_send:auth");
      ws.send(JSON.stringify({ type: "auth", pin: pin, passkey: resumeToken ? null : faceCred,
        resume: resumeToken || "", target: target, voice: phoneVoice ? "phone" : "mac", ears: earsPhone ? "phone" : "mac", standalone: !!navigator.standalone }));
    };
    ws.onmessage = ev => {
      if (typeof ev.data !== "string") { logEvent("ws_recv:binary"); onAudio(ev.data); return; }
      const m = JSON.parse(ev.data);
      logEvent("ws_recv:" + m.type + (m.state ? ":" + m.state : ""));
      if (m.type === "auth_ok") {
        settled = true; reconnectTries = 0; faceCred = null;
        if (m.version) currentVersion = m.version;
        if (m.resume) resumeToken = m.resume;   // reconnects in this call: no PIN, no Face ID again
        if (m.targets) buildTargets(m.targets);
        else buildTargets(targets);
        if (pin && window.PublicKeyCredential && m.passkeys === 0) { logEvent("ws_send:passkey_register_options"); ws.send(JSON.stringify({ type: "passkey_register_options" })); }
        if (liveMode) {
          liveOk = false;
          setState("connecting");
          logEvent("ws_send:live:on");
          ws.send(JSON.stringify({ type: "live", on: true }));
        }
        resolve();
      }
      else if (m.type === "auth_fail" || m.type === "auth_retry") { settled = true; reject(m); }
      else onMessage(m);
    };
    ws.onerror = () => { if (!settled) { settled = true; reject({ type: "net" }); } };
    ws.onclose = () => { if (!settled) { settled = true; reject({ type: "net" }); } else if (inCall) onDrop(); };
  });
}

function liveRecentlyFailed() {
  const t = parseInt(load("liveFailedAt") || "0", 10);
  return t > 0 && Date.now() - t < 10 * 60 * 1000;   // retry Live 10 minutes after a failure
}
function handleLiveError(t) {
  store("liveFailedAt", String(Date.now()));
  liveOk = false;
  setLive(false, true);
  // iOS may only allow listening after a tap: if the ears do not start by themselves, one tap on this chip does it
  addChip("Live unavailable, normal mode for now (" + (t || "error") + "). Tap here if I don't hear you.", true,
          () => { recogWant = true; stopRecog(); startRecog(); render(); });
}

function armLiveDrop() {
  liveDropAudio = true;
  clearTimeout(liveSilenceTimer);
  liveSilenceTimer = setTimeout(() => { liveDropAudio = false; }, 300);
}

function onMessage(m) {
  lastMsg = m.type + (m.state ? ':' + m.state : '');
  if (m.type === "status") {
    if ((m.state === "speaking" || m.state === "working") && ackPending === 0) lastSent = "";
    if (m.state === "listening" && ackPending > 0) { ackPending--; dropAudio = ackPending > 0; }
    if (liveMode && !liveOk) {
      serverState = "connecting";
      render();
    } else {
      setState(m.state);
    }
  } else if (m.type === "transcript") addMsg(m.role, m.text);
  else if (m.type === "handoff") addChip("Handed to " + (m.to || "a session") + ": " + m.text, false);
  else if (m.type === "say") speakText(m.text);
  else if (m.type === "passkey_options") offerFaceId(m.options);
  else if (m.type === "voice_used") addChip("Qwen was slow, so the Mac voice spoke this time.", false);
  else if (m.type === "passkey_ok") { addChip("Face ID is on. Next time just tap Talk to Dot.", false); }
  else if (m.type === "passkey_fail") addChip("Face ID setup did not work. The PIN still works.", true);
  else if (m.type === "error") { lastSent = ""; addChip("Error: " + m.message, true); }
  else if (m.type === "live_ok") {
    liveOk = true;
    setState("listening");
  }
  else if (m.type === "live_audio") {
    if (liveDropAudio) {
      clearTimeout(liveSilenceTimer);
      liveSilenceTimer = setTimeout(() => { liveDropAudio = false; }, 300);
      return;
    }
    playLiveAudioChunk(m.b64);
  }
  else if (m.type === "live_stop") {
    stopLivePlayback();
    armLiveDrop();
  }
  else if (m.type === "live_partial") showLive(m.text || "");   // her words while she is still talking (Live)
  else if (m.type === "live_heard") { showLive(""); if (m.text) addMsg("user", m.text); }
  else if (m.type === "live_said") {
    showLive("");
    clearTimeout(liveSilenceTimer);
    liveDropAudio = false;
    if (m.text) addMsg("assistant", m.text);
  }
  else if (m.type === "live_error") {
    handleLiveError(m.text);
  }
}

async function onDrop() {
  if (!inCall) return;
  liveOk = false;
  clearTimeout(liveSilenceTimer);
  liveDropAudio = false;
  stopLivePlayback();
  addChip("Connection lost", true);
  while (inCall && reconnectTries < 6) {
    reconnectTries++;
    await new Promise(r => setTimeout(r, Math.min(1000 * reconnectTries, 5000)));
    try { await connect(); addChip("Reconnected", false); return; } catch (e) { if (e && e.type === "auth_fail") break; }
  }
  if (inCall) { addChip("Could not reconnect. Tap End call, then start again.", true); }
}


// ---------------------------------------------------------------- phone voice (the iPhone speaks; no audio travels from the Mac)
function pickVoice(zh) {
  let vs = [];
  try { vs = speechSynthesis.getVoices() || []; } catch (e) {}
  const lang = zh ? /^zh[-_]cn|^zh$/i : /^en[-_]/i;
  const ok = vs.filter(v => lang.test(v.lang || ""));
  const best = ok.find(v => /premium|enhanced/i.test(v.name)) || ok.find(v => /ting|xiaoxiao|samantha|ava|allison/i.test(v.name)) || ok[0];
  return best || null;
}
function splitPieces(text) {
  return (String(text).match(/[^.!?\u3002\uff01\uff1f\n]+[.!?\u3002\uff01\uff1f]*/g) || [String(text)]).map(s => s.trim()).filter(Boolean);
}
function speakText(text) {
  if (dropAudio || !phoneVoice || !('speechSynthesis' in window)) return;
  lastSent = "";
  const gen = genId;
  splitPieces(text).forEach(piece => {
    const u = new SpeechSynthesisUtterance(piece);
    const zh = /[\u4e00-\u9fff]/.test(piece);
    u.lang = zh ? "zh-CN" : "en-US";
    const v = pickVoice(zh); if (v) u.voice = v;
    u.rate = 1.05;
    u.onstart = () => { if (gen === genId) { playing = true; render(); reportFirstSound(0); } };
    const done = () => { speakCount = Math.max(0, speakCount - 1); if (!speakCount) { playing = false; loudMs = 0; render(); } };
    u.onend = done; u.onerror = done;
    speakCount++;
    speechSynthesis.speak(u);
  });
}
function unlockSpeech() {   // iOS only allows speech after a tap
  try { if ('speechSynthesis' in window) { speechSynthesis.getVoices(); const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {}
}
try { if (location.search.indexOf('debug') >= 0) document.body.classList.add('debug'); } catch (e) {}

// ---------------------------------------------------------------- phone ears (the iPhone's own speech recognition; the Mac does no listening)
function sendText(t, waitedMs) {
  if (!ws || ws.readyState !== 1) return;
  const toSend = (lastSent ? lastSent + " " + t : t).trim();
  lastSent = toSend;
  logEvent("ws_send:text");
  ws.send(JSON.stringify({ type: "text", text: toSend }));
  speechEndAt = performance.now() - (waitedMs || 0); metricSent = false;   // phone ears: the caller stopped about waitedMs ago
  setState("thinking");
}
function showLive(t) {
  let d = $("liveMsg");
  if (!t) { if (d) d.remove(); return; }
  if (!d) { d = document.createElement("div"); d.id = "liveMsg"; d.className = "msg user live"; $("log").appendChild(d); }
  d.textContent = t; $("log").scrollTop = $("log").scrollHeight;
}
function startRecog() {
  if (!SR || recog || !recogWant || !inCall && !starting) return;
  logEvent("recog:start");
  const r = new SR();
  r.lang = recogLang; r.continuous = true; r.interimResults = true;
  r.onresult = ev => {

    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "live", on: false }));
    stopLivePlayback();
    if (earsPhone) {
      try { if (node) node.disconnect(); } catch (e) {} node = null;
      try { if (stream) stream.getTracks().forEach(t => { t.enabled = false; }); } catch (e) {}
      recogWant = true;
      startRecog();
    } else {
      recogWant = false;
      stopRecog();
      try {
        await setupMicCapture();
      } catch (e) {
        addChip("Microphone unavailable", true);
      }
    }
  }
  render();
}

$("liveBtn").onclick = async () => {
  if (!inCall) return;
  await setLive(!liveMode);
};

$("langBtn").onclick = () => {
  recogLang = recogLang === "zh-CN" ? "en-US" : "zh-CN"; store('lang', recogLang); setEarsButton();
  if (recog) { stopRecog(); }   // render restarts it with the new language
  render();
};
$("stopTalk").onclick = () => { if (inCall) { lastSent = ""; interrupt(); } };   // Skip drops the words too
let orbLevel = 0;
function orbScale(level) {   // follows her voice gently: smoothed and small, so the face never jitters
  orbLevel = orbLevel * 0.85 + Math.min(0.05, level * 0.6) * 0.15;
  return "scale(" + (1 + orbLevel).toFixed(3) + ")";
}
const LOOKS = ["/dot/dot-portrait.jpg", "/dot/dot-real.jpg", "/dot/dot-cartoon.jpg"];
function faceImg(img, src) {
  if (!img) return;
  const box = img.parentNode;
  img.onerror = () => { img.classList.add("gone"); if (box) box.classList.add("noimg"); };   // no picture: show the ring look only
  img.onload = () => { img.classList.remove("gone"); if (box) box.classList.remove("noimg"); };
  img.src = src;
  if (img.complete && img.naturalWidth === 0) {
    img.classList.add("gone");
    if (box) box.classList.add("noimg");
  }
}
function setLook(i) { const src = LOOKS[(i + LOOKS.length) % LOOKS.length]; faceImg($("dotImg"), src); faceImg($("loginFace").querySelector("img"), src); }
if (load("lookPortrait") !== "1") { store("lookPortrait", "1"); store("dotLook", "0"); }   // the new portrait first, once
let look = parseInt(load("dotLook") || "0", 10) || 0; setLook(look);
$("orb").onclick = () => { look = (look + 1) % LOOKS.length; store("dotLook", String(look)); setLook(look); };
// ---------------------------------------------------------------- who the caller talks to (menu at the top)
let target = load("target") || "AUTO", targets = [["AUTO", "Auto"]];
function targetLabel() { const t = targets.find(x => x[0] === target); return t ? t[1] : "Auto"; }
function buildTargets(list) {
  targets = list;
  if (!targets.some(x => x[0] === target)) target = "AUTO";
  $("toLbl").textContent = targetLabel();
  const box = $("toList"); box.innerHTML = "";
  targets.forEach(([k, label], i) => {
    if (i === 3) box.appendChild(document.createElement("hr"));   // Auto / ORG / Dot, then the sessions
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    if (k === target) b.className = "sel";
    b.onclick = () => {
      target = k; store("target", k); $("toLbl").textContent = label; $("toMenu").classList.add("hidden");
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "target", role: k }));
      addChip(k === "AUTO" ? "Talking to Dot; it sends work to the right session." : "Talking to " + label + ": work goes straight there.", false);
      buildTargets(targets);
    };
    box.appendChild(b);
  });
  if (resumeToken) {
    box.appendChild(document.createElement("hr"));
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "Sessions board";
    b.onclick = () => {
      $("toMenu").classList.add("hidden");
      window.open("/board?t=" + encodeURIComponent(resumeToken), "_blank", "noopener,noreferrer");
    };
    box.appendChild(b);
  }
  if (inCall) {
    const bb = document.createElement("button");
    bb.type = "button";
    bb.textContent = "Report a bug";
    bb.onclick = () => { $("toMenu").classList.add("hidden"); reportBug("menu"); };
    box.appendChild(bb);
  }
}
$("toBtn").onclick = () => { buildTargets(targets); $("toMenu").classList.remove("hidden"); };
$("toMenu").onclick = e => { if (e.target === $("toMenu")) $("toMenu").classList.add("hidden"); };
$("mute").onclick = () => {
  muted = !muted;
  $("mute").classList.toggle("on", muted);
  $("mute").querySelector(".lbl").textContent = muted ? "Unmute" : "Mute";
  if (muted) {
    inSpeech = false; utter = []; stopRecog();
    liveAcc = []; liveAccLen = 0;
  }
  recogWant = !liveMode && earsPhone && !muted;
  render();
};
setLiveButton();
setEarsButton();
</script>
</body>
</html>
